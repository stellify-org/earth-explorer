services:
  api:
    build:
      context: ./backend
      additional_contexts:
        science-vis: ./science/vis
      args:
        GRID_VARS: ${GRID_VARS:-t2m precip u10m v10m soilwet qv2m rh2m}
        GRIDS_REFRESH: ${GRIDS_REFRESH:-}
    environment:
      PORT: "8787"
      CACHE_DIR: /data/cache
      GRIDS_DIR: /data/grids
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - api-cache:/data/cache
    restart: unless-stopped
    mem_limit: 256m

  web:
    build:
      context: ./frontend
      additional_contexts:
        science-geo: ./science/geo
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m

volumes:
  api-cache:
